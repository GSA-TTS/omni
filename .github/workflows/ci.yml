name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install mise and zizmor
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: zizmor
          cache: false

      - name: Run quality gates
        run: make check

      - name: Validate committed config against schema
        run: |
          uv run python -c "
          from pathlib import Path
          from harness.config import validate_config
          import tomllib
          validate_config(tomllib.load(open('omni-project.toml','rb')), source=Path('omni-project.toml'))
          print('omni-project.toml valid')
          "
