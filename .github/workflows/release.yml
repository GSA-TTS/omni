name: Release

# Publishes a standalone PyInstaller binary of omni-sync.
#
#   * Every merge to main  -> auto patch release  1.0.<github.run_number>
#   * Push a tag v1.1.0     -> release that exact version (minor/major bump)
#
# PyInstaller bundles CPython, omni-sync, dependencies, schemas, and templates
# into a single executable per OS/arch. git-cliff generates the notes.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            # Patch stream off main: 1.0.<run_number>
            echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set wheel version
        shell: bash
        run: |
          uv sync --locked
          uv version "$VERSION"

      - name: Build wheel
        shell: bash
        run: uv build --wheel

      - name: Build standalone binary
        shell: bash
        run: |
          name="omni-sync-${VERSION}-${{ matrix.target }}"
          out="${name}${{ matrix.ext }}"
          uv run --no-sync pyinstaller \
            --onefile \
            --name "$name" \
            --add-data ".env.example:harness/resources" \
            --add-data "users.toml.example:harness/resources" \
            --add-data "schema/omni-project.schema.json:harness/resources/schema" \
            --add-data "schema/users.schema.json:harness/resources/schema" \
            harness/__main__.py
          mv "dist/$out" "$out"
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

      - name: Smoke-test the binary
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          binary="$PWD/$ARTIFACT"
          workspace="$RUNNER_TEMP/omni-bootstrap"
          mkdir -p "$workspace"
          cd "$workspace"
          "$binary" init --directory "$workspace" \
            --project 'jira.project_key="TEST"' \
            --project 'github.org="example-org"' \
            --project 'github.repos=["example-repo"]' \
            --project 'sync.sync_labels=true' \
            --project 'sync.sync_status=false' \
            --user 'person@agency.gov.gh="example-user"' \
            --group 'example-team.members=["person@agency.gov"]' \
            --group 'example-team.github_org="example-org"' \
            --group 'example-team.github_team="example-team"'
          "$binary" validate
          test -f omni-project.toml
          test -f users.toml
          test -f .env
          grep -q 'project_key = "TEST"' omni-project.toml
          grep -q 'gh = "example-user"' users.toml
          cp omni-project.toml omni-project.before
          "$binary" init --directory "$workspace" \
            --jira-project-key OTHER \
            --github-org other-org \
            --github-repo other-repo
          cmp omni-project.before omni-project.toml
          rm omni-project.before
          "$binary" init --force --directory "$workspace" \
            --jira-project-key OTHER \
            --github-org other-org \
            --github-repo other-repo
          grep -q 'project_key = "OTHER"' omni-project.toml
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: omni-sync-${{ matrix.target }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false

      - name: Generate release notes (git-cliff)
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mise exec git-cliff -- git cliff --tag "$TAG" --output CHANGELOG.md
          mise exec git-cliff -- git cliff --tag "$TAG" --latest --strip header --output RELEASE_NOTES.md

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mapfile -d '' artifacts < <(find artifacts -type f -name 'omni-sync-*' -print0)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release artifacts found" >&2
            exit 1
          fi
          python - <<'PY'
          import hashlib
          from pathlib import Path

          artifacts = sorted(path for path in Path("artifacts").rglob("*") if path.is_file())
          with Path("SHA256SUMS.txt").open("w", encoding="utf-8") as output:
              for artifact in artifacts:
                  digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
                  output.write(f"{digest}  {artifact.name}\n")
          PY
          artifacts+=(SHA256SUMS.txt)
          gh release create "$TAG" "${artifacts[@]}" \
            --title "omni-sync $VERSION" \
            --notes-file RELEASE_NOTES.md
