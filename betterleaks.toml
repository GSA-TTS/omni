# betterleaks configuration (gitleaks-compatible schema).
# Scans the repo for API keys, tokens, and other secrets.
#
#   betterleaks dir . --config betterleaks.toml
#
# Keep all built-in detection rules, then allowlist local secret files that
# are intentionally gitignored and never committed.

title = "omni-sync betterleaks config"

[extend]
# Inherit the full default rule set (AWS, GitHub/GitLab PATs, Atlassian/Jira
# tokens, SSH private keys, generic high-entropy secrets, etc.).
useDefault = true

[allowlist]
description = "Local secret files that are gitignored and must not be flagged"
# Exclude the local env file(s) that legitimately hold tokens. These are in
# .gitignore and are never committed; scanning them only produces noise.
# .env.example ships placeholder values only and is intentionally NOT excluded.
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.env\..*''',
  '''(^|/)\.ssh/config\.bak.*''',
]
