# git-cliff changelog configuration.
# https://git-cliff.org/docs/configuration
#
# Conventional-commits -> grouped CHANGELOG + release notes. Used by the
# release CI (`.github/workflows/release.yml`) and locally via mise:
#   git cliff --tag <tag> --output CHANGELOG.md
#   git cliff --latest --strip header   # release-notes body

[changelog]
header = """
# Changelog

All notable changes to omni-sync are documented here. This project adheres to
[Semantic Versioning](https://semver.org/): 1.0.x patch releases ship from
every merge to main, and a `v1.1.0`-style tag bumps the minor version.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

# Map commit prefixes to changelog groups. Unprefixed commits fall into "Other".
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci|^build", group = "CI/Build" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Chores" },
  { message = ".*", group = "Other" },
]
