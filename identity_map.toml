# handle. On Helix you sign in via SSO as "ghes-login-1" (the SAML
# external UID) but your login is "johnhjediny". See README Authentication.
"person.one@agency.gov" = "johnhjediny"

["https://github.com/GSA-TTS"]
"person.one@agency.gov" = "jjediny"

["https://workshop.cloud.gov/"]
