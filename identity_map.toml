# Identity map: canonical person (email) -> per-host username.
#
# Pivot field is the email address, so the same person is resolvable across
# every provider host regardless of their differing usernames. Consumed by
# the harness to translate assignees between GitHub.com, GitHub Enterprise
# Server (Helix), and GitLab (cloud.gov).
#
# Table = host base URL (quoted; TOML bare keys cannot contain / or :).
# Each row =  "<email>" = "<username on that host>"

["https://github.helix.gsa.gov/"]
