[project]
name = "omni-sync"
version = "1.0.0"
description = "Unified CLI and sync harness across GitHub.com, GitHub Enterprise Server, GitLab, and Jira"
authors = [
    { name = "omni-sync contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "typer==0.27.3",
    "pydantic==2.13.5",
    "rich==15.0.0",
    "jsonschema==4.26.0",
    "tomli-w==1.2.0",
]

[project.scripts]
omni-sync = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "harness/resources/.env.example"
"users.toml.example" = "harness/resources/users.toml.example"
"schema/omni-project.schema.json" = "harness/resources/schema/omni-project.schema.json"
"schema/users.schema.json" = "harness/resources/schema/users.schema.json"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.16.0",
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "pyinstaller==6.22.3",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
ignore = ["B008"] # Typer uses Option/Argument calls as declarative defaults.

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["harness"]

[tool.coverage.report]
fail_under = 75
show_missing = true
