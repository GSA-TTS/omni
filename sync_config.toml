# GitHub <-> Jira synchronization configuration.
#
# Used by:
#   omni-sync gh-jira sync-jira-from-github    (Jira <- GitHub)
#   omni-sync gh-jira backfill-github-from-jira (GitHub <- Jira, assignee only)
#
# All string keys are lower-cased on lookup to be case-tolerant.
# Transposed from the TTSE petrified-forest sync tooling.

[jira]
base_url = "https://gsa-standard.atlassian-us-gov-mod.net"
project_key = "FPDF"
# Atlassian CLI binary path (Homebrew default on macOS).
acli_bin = "/opt/homebrew/bin/acli"

[github]
org = "GSA-TTS"
# First entry is the primary/default repo when creating new stubs.
repos = [
  "TTSE-petrified-forest-pipeline",
  "TTSE-petrified-forest",
]
project_number = 101

[sync]
sync_labels     = true
sync_assignee   = true
sync_milestone  = true   # emitted as a Jira label: `milestone:PI-6-Iteration-6.1`
sync_status     = false  # transitions require workflow knowledge -- off by default
append_updates  = true   # post/update a dedicated Jira COMMENT (never the description
                         # field -- an earlier version wrote this into `description`
                         # and destroyed rich ADF formatting on ~82 real tickets)

milestone_label_prefix = "milestone:"
jira_skip_status_categories = ["Done"]

# GitHub login -> Jira assignee email. Case-insensitive on lookup.
[developers]
gh-login-1            = "person.one@agency.gov"
"gh-login-2"        = "person.two@agency.gov"
"gh-login-3"    = "person.three@agency.gov"
"gh-login-4"         = "person.four@agency.gov"
"gh-login-5"      = "person.five@agency.gov"
"gh-login-6"       = "person.six@agency.gov"
"gh-login-7"          = "person.seven@agency.gov"
"gh-login-8" = "person.eight@agency.gov"
"gh-login-9"     = "person.nine@agency.gov"
"gh-login-10"      = "person.ten@agency.gov"
"gh-login-11"    = "person.eleven@agency.gov"
"gh-login-12"         = "person.twelve@agency.gov"
"gh-login-13"       = "person.thirteen@agency.gov"
"gh-login-14"  = "person.fourteen@agency.gov"
"gh-login-15"       = "person.fifteen@agency.gov"
"gh-login-16"   = "person.sixteen@agency.gov"
"gh-login-17"        = "person.seventeen@agency.gov"

# GitHub label -> Jira label. Unlisted labels pass through (sanitized:
# Jira labels cannot contain spaces, so spaces become hyphens).
[labels]
"bug"                              = "bug"
"enhancement"                      = "enhancement"
"documentation"                    = "documentation"
"priority:highest"                 = "priority-highest"
"priority:high"                    = "priority-high"
"priority:medium"                  = "priority-medium"
"priority:low"                     = "priority-low"
"area:pipeline"                    = "area-pipeline"
"area:star-schema"                 = "area-star-schema"
"area:ocr"                         = "area-ocr"
"area:crosswalk"                   = "area-crosswalk"
"area:dashboard"                   = "area-dashboard"
"area:data-quality"                = "area-data-quality"
"area:docs"                        = "area-docs"
"area:infra"                       = "area-infra"
"area:schema"                      = "area-schema"
"area:udm"                         = "area-udm"
"area:website"                     = "area-website"
"workstream:pipeline-architecture" = "workstream-pipeline-architecture"
"jira-migrated"                    = "github-sync"

# Labels stamped on every synced Jira ticket for traceability.
[always_apply]
jira_labels = ["github-sync"]
